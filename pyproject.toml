[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryoemdoc"
version = "0.1.0"
description = "Inference-first cryo-EM image triage and documentation tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "cryoEMdoc contributors"}
]
keywords = ["cryo-em", "microscopy", "image-classification", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pandas",
  "pillow",
  "opencv-python-headless",
  "tifffile",
]

[project.optional-dependencies]
mrc = ["mrcfile"]
dev = ["pytest"]
train = [
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "tqdm",
  "openpyxl",
]

[project.scripts]
cryoemdoc = "cryoemdoc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryoemdoc = [
  "py.typed",
  "artifacts/**/*.json",
  "artifacts/**/*.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that load full neural network weights or run model inference",
]
